dataset:
  id: drebin_subset_15036
  version: "1.0"
  source_manifest: metadata/source_manifest.yml
  checksum_sha256: "710f2c11b0cad04c36f56dd16398127feb697fd99e8efa7f75890b792fba3ad5"
  license: "DREBIN dataset license; see README"
  redistribution: "raw CSV not committed; acquire from original source"

schema:
  row_count_expected: 15036
  column_count_expected: 216
  target_column: class
  target_values: [B, S]

  feature_columns:
    description: "All columns except class"
    expected_count: 215
    source_dtype: "integer or object for TelephonyManager.getSimCountryIso"
    staging_dtype: integer
    staging_allowed_values: [0, 1]

  column_overrides:
    TelephonyManager.getSimCountryIso:
      source_allowed_values: ["0", "1", "?", 0, 1]
      staging_allowed_values: [0, 1]
      staging_null_value: 0

  nullability:
    class: false
    features: false

  uniqueness:
    key: null
    duplicate_policy: "warn or quarantine; deterministic row hash available"

  business_rules:
    - name: target_binary
      column: class
      rule: "value in {'S','B'}"
    - name: features_binary_after_staging
      rule: "all feature columns are in {0,1} after staging"

violation_behavior:
  schema: fail
  nullability: fail
  invalid_row: quarantine
  duplicate_row: warn

duplicates:
  assumption: "one source row = one legitimate app observation"
  policy: keep
  scope: all_columns
  conflicting_label_policy: warn
  sensitivity_conflicting_label_policy: quarantine
  reason: >
    Baseline reproduction requires preserving the full source population (15036 rows).
    Removing or reassigning duplicate and conflicting rows changes the population,
    class balance, and train/test split, making baseline metrics incomparable.
  evidence_artifact: metadata/source_profile.md#duplicate-audit
  dtypes_at_read:
    TelephonyManager.getSimCountryIso: string

  observed_on_source:
    rows: 15036
    exact_duplicate_rows_total: 10047
    exact_duplicate_rows_extra: 7775
    duplicate_feature_rows_total: 10049
    duplicate_feature_rows_extra: 7778
    conflicting_label_groups: 3
    conflicting_label_rows: 398
    groups:
      - size: 385
        label_counts: {B: 377, S: 8}
        all_zero_vector: true
      - size: 11
        label_counts: {B: 9, S: 2}
        all_zero_vector: false
      - size: 2
        label_counts: {S: 1, B: 1}
        all_zero_vector: false

  expected_effects:
    - "Random stratified split places some identical feature vectors in both train and test. This is identity leakage and inflates test metrics relative to a grouped split."
    - "The 385-row all-zero group is inherent label noise; no feature-based model can separate its members beyond the majority label."
    - "Primary reproduction preserves this population. A secondary sensitivity run with deduplication and conflict quarantine documents the metric delta."

  sensitivity_run:
    enabled: false
    drop_exact_duplicates: true
    quarantine_conflicting_labels: true